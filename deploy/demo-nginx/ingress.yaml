apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-nginx-ingress
  namespace: demo
  labels:
    app: demo-nginx
    app.kubernetes.io/name: demo-nginx
    app.kubernetes.io/part-of: home-k8s-platform
spec:
  ingressClassName: nginx
  rules:
    - host: demo.k3s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-nginx
                port:
                  number: 80
