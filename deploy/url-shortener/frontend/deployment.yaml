apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-frontend
  namespace: url-shortener
  labels:
    app: url-shortener-frontend
    app.kubernetes.io/name: url-shortener-frontend
    app.kubernetes.io/part-of: home-k8s-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: url-shortener-frontend
  template:
    metadata:
      labels:
        app: url-shortener-frontend
        app.kubernetes.io/name: url-shortener-frontend
        app.kubernetes.io/part-of: home-k8s-platform
    spec:
      containers:
        - name: frontend
          image: localhost:5000/url-shortener-frontend:0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
