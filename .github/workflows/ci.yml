name: URL Shortener CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/url-shortener/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/url-shortener/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/url-shortener/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run backend test script if exists
        run: npm test --if-present

      - name: Run backend build script if exists
        run: npm run build --if-present

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/url-shortener/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run frontend test script if exists
        run: npm test --if-present

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build backend Docker image
        run: |
          docker build \
            -t url-shortener-backend:ci \
            apps/url-shortener/backend

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_API_BASE=http://url.k3s.local \
            -t url-shortener-frontend:ci \
            apps/url-shortener/frontend

      - name: List built Docker images
        run: |
          docker images | grep url-shortener
